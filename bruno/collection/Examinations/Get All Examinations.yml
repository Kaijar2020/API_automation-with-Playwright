info:
  name: Get All Examinations
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/prescription/Examinations?page=1&pageSize=20"
  headers:
    - name: Authorization
      value: Bearer {{authToken}}
    - name: Accept
      value: application/json
  params:
    - name: page
      value: "1"
      type: query
      description: "Page number (int32, default: 1)"
    - name: pageSize
      value: "20"
      type: query
      description: "Items per page (int32, default: 20)"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ## Get All Examinations

  ### Response — 200 OK
  Returns `ExaminationSearchDtoPagedResult`:
  ```json
  {
    "items": [
      {
        "id": "uuid",
        "clinicalNoteEn": "Tenderness in the right iliac fossa",
        "clinicalNoteBn": "ডান ইলিয়াক ফোসায় ব্যথা"
      }
    ],
    "totalCount": 200,
    "pageNumber": 1,
    "pageSize": 20
  }
  ```
