info:
  name: Get All Drugs
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/prescription/Drugs?page=1&pageSize=20"
  headers:
    - name: Authorization
      value: Bearer {{authToken}}
    - name: Accept
      value: application/json
  params:
    - name: page
      value: "1"
      type: query
      description: "Page number (int32, default: 1)"
    - name: pageSize
      value: "20"
      type: query
      description: "Items per page (int32, default: 20)"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ## Get All Drugs

  Returns a paginated list of drugs from the catalog.

  ### Response — 200 OK
  Returns `DrugSearchDtoPagedResult`:
  ```json
  {
    "items": [
      {
        "drugId": "uuid",
        "groupName": "Analgesics",
        "genericName": "Paracetamol",
        "doseEng": "500mg",
        "doseBng": "৫০০ মি.গ্রা.",
        "brandName": "Napa",
        "strength": "500mg",
        "formulationShortName": "Tab",
        "formulationFullName": "Tablet",
        "companyName": "Beximco",
        "fullName": "Napa 500mg Tablet",
        "description": "string",
        "drugDose": "string",
        "shortDose": "string"
      }
    ],
    "totalCount": 5000,
    "pageNumber": 1,
    "pageSize": 20
  }
  ```
