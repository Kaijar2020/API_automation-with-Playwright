info:
  name: Download Prescription PDF
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/v1/prescription/Prescriptions/{{prescriptionId}}/pdf"
  headers:
    - name: Authorization
      value: Bearer {{authToken}}
    - name: Accept
      value: application/pdf
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ## Download Prescription PDF

  Streams the prescription as a PDF binary file.

  ### Path Parameters
  | Parameter | Type | Required | Description |
  |-----------|------|----------|-------------|
  | id | string (uuid) | **Yes** | Prescription unique identifier |

  ### Response — 200 OK
  `Content-Type: application/pdf` — binary stream.

  ### Response — 404 Not Found

  > **Tip:** In Postman, click **Send and Download** to save the PDF file.
