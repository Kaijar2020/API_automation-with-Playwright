info:
  name: Get Prescription by ID
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/prescription/Prescriptions/{{prescriptionId}}"
  headers:
    - name: Authorization
      value: Bearer {{authToken}}
    - name: Accept
      value: application/json
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ## Get Prescription by ID

  ### Path Parameters
  | Parameter | Type | Required | Description |
  |-----------|------|----------|-------------|
  | id | string (uuid) | **Yes** | Prescription unique identifier |

  ### Response — 200 OK
  Returns `PrescriptionDetailDto` with all sections (vitals, complaints, drugs, advices, investigations).

  ### Response — 404 Not Found
