info:
  name: Get Formatted Prescription
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/api/v1/prescription/Prescriptions/{{prescriptionId}}/formatted"
  headers:
    - name: Authorization
      value: Bearer {{authToken}}
    - name: Accept
      value: application/json
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ## Get Formatted Prescription

  Returns a layout-structured prescription split into left and right sections for display.

  ### Response — 200 OK
  Returns `FormattedPrescriptionDto`:

  **leftSection** contains:
  - `chiefComplaints` → `currentComplaints[]` + `history[]`
  - `onExamination` → `VitalSignsDto` (height, weight, BMI, BP, pulse, clinicalFindings)
  - `testsAdvised[]` → investigation list
  - `diagnosis` → diagnosis string

  **rightSection** contains:
  - `drugs[]` → drug list
  - `advices[]` → advice list

  ### Response — 404 Not Found
