info:
  name: Get Prescriptions by Patient + Doctor
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/v1/prescription/Prescriptions/patient/{{patientId}}/doctor/{{doctorId}}"
  headers:
    - name: Authorization
      value: Bearer {{authToken}}
    - name: Accept
      value: application/json
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ## Get Prescriptions by Patient + Doctor

  Returns prescriptions filtered by both patient and doctor.

  ### Path Parameters
  | Parameter | Type | Required | Description |
  |-----------|------|----------|-------------|
  | patientId | string (uuid) | **Yes** | Patient unique identifier |
  | doctorId | string (uuid) | **Yes** | Doctor unique identifier |

  ### Response — 200 OK
  Returns array of `PrescriptionDetailDto`.
