info:
  name: Get Prescriptions by Patient
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/prescription/Prescriptions/patient/{{patientId}}"
  headers:
    - name: Authorization
      value: Bearer {{authToken}}
    - name: Accept
      value: application/json
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ## Get Prescriptions by Patient

  Returns all prescriptions for a given patient.

  ### Path Parameters
  | Parameter | Type | Required | Description |
  |-----------|------|----------|-------------|
  | patientId | string (uuid) | **Yes** | Patient unique identifier |

  ### Response — 200 OK
  Returns array of `PrescriptionDetailDto`.
