info:
  name: Update Prescription Status
  type: http
  seq: 9

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/prescription/Prescriptions/{{prescriptionId}}/status"
  headers:
    - name: Authorization
      value: Bearer {{authToken}}
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "status": "active"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ## Update Prescription Status

  Changes the lifecycle status of a prescription.

  ### Path Parameters
  | Parameter | Type | Required | Description |
  |-----------|------|----------|-------------|
  | id | string (uuid) | **Yes** | Prescription unique identifier |

  ### Request Body — `UpdatePrescriptionStatusRequest`
  | Field | Type | Required | Description |
  |-------|------|----------|-------------|
  | status | string (enum) | **Yes** | One of: `draft`, `active`, `completed`, `cancelled`, `expired` |

  ### Status Transitions (recommended flow)
  ```
  draft → active → completed
         ↓
      cancelled
  ```

  ### Response — 200 OK / 404 Not Found
