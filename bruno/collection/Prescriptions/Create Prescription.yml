docs: |-
  ## Create Prescription

  Creates a new prescription for a patient.

  ### Request Body — `CreatePrescriptionRequest`

  #### Top-level Fields
  | Field | Type | Required | Description |
  |-------|------|----------|-------------|
  | patientId | string (uuid) | **Yes** | Patient unique identifier |
  | doctorId | string (uuid) | **Yes** | Doctor unique identifier |
  | isDraft | boolean | **Yes** | Save as draft (true) or finalize (false) |
  | visitType | string | No | e.g. OPD, IPD, Teleconsult |
  | diagnosis | string | No | Free-text diagnosis |
  | clinicalFindings | string | No | Clinical notes/findings |
  | notes | string | No | Additional prescription notes |
  | height | string | No | Patient height value |
  | heightUnit | string | No | cm or ft |
  | weight | string | No | Patient weight value |
  | weightUnit | string | No | kg or lb |
  | bpSystolic | string | No | Systolic BP reading |
  | bpDiastolic | string | No | Diastolic BP reading |
  | pulseRate | string | No | Pulse rate (bpm) |
  | followUpDate | string (date-time) | No | ISO 8601 follow-up date |
  | followUpInstructions | string | No | Instructions for follow-up |
  | referredBy | string | No | Referring doctor name |

  #### chiefComplaints[] — `CreatePrescriptionChiefComplaintItem`
  | Field | Type | Required | Description |
  |-------|------|----------|-------------|
  | id | string (uuid) | No | Existing item ID (for updates) |
  | conceptId | integer (int64) | No | SNOMED CT concept ID |
  | term | string | No | Complaint term text |
  | aiSuggestedTerm | string | No | AI suggested alternative term |
  | isVerified | boolean | **Yes** | Whether term is verified |
  | isCurrent | boolean | **Yes** | Whether complaint is current |
  | remarks | string | No | Duration/details |

  #### drugs[] — `CreatePrescriptionDrugItem`
  | Field | Type | Required | Description |
  |-------|------|----------|-------------|
  | id | string (uuid) | No | Existing item ID |
  | drugName | string | No | Display drug name |
  | drugId | string (uuid) | No | Link to drug catalog |
  | genericName | string | No | INN generic name |
  | form | string | No | Tablet/Syrup/Capsule |
  | strength | string | No | Strength (e.g. 500mg) |
  | dosageInstructions | string | No | Bengali dosage (e.g. ১+০+১) |
  | dosageInstructionsEnglish | string | No | English dosage |
  | duration | string | No | Treatment duration |
  | instructions | string | No | Special instructions |
  | sortOrder | integer (int32) | **Yes** | Display order |

  #### advices[] — `CreatePrescriptionAdviceItem`
  | Field | Type | Required | Description |
  |-------|------|----------|-------------|
  | id | string (uuid) | No | Existing item ID |
  | description | string | No | Custom advice text |
  | adviceId | string (uuid) | No | Link to advice catalog |
  | sortOrder | integer (int32) | **Yes** | Display order |

  #### investigations[] — `CreatePrescriptionInvestigationItem`
  | Field | Type | Required | Description |
  |-------|------|----------|-------------|
  | id | string (uuid) | No | Existing item ID |
  | name | string | No | Test name |
  | testId | string (uuid) | No | Link to medical tests catalog |
  | abbreviation | string | No | Short name |
  | instructions | string | No | Sample collection instructions |
  | isUrgent | boolean | **Yes** | Mark as urgent |
  | sortOrder | integer (int32) | **Yes** | Display order |
  | testResult | string | No | Result value |
  | isNormal | string | No | Normal/Abnormal indicator |
  | resultNote | string | No | Interpretation note |

  ### Response — 201 Created
  Returns `PrescriptionDetailDto`.

  ### Response — 400 Bad Request
