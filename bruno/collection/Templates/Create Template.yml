settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ## Create Template

  ### Request Body — `CreateTemplateRequest`

  #### Top-level Fields
  | Field | Type | Required | Description |
  |-------|------|----------|-------------|
  | doctorId | string (uuid) | **Yes** | Owning doctor ID |
  | shortcut | string | No | Quick-access shortcut code (e.g. DM2) |
  | name | string | No | Template display name |
  | templateType | string (enum) | **Yes** | `global` \| `treatment` \| `advice` \| `test` |
  | followUp | string | No | Default follow-up period |

  #### chiefComplaints[] — `CreateTemplateChiefComplaintItem`
  | Field | Type | Required | Description |
  |-------|------|----------|-------------|
  | chiefComplaintId | integer (int64) | No | SNOMED concept ID |
  | customDescriptionEn | string | No | Custom English description |
  | customDescriptionBn | string | No | Custom Bengali description |
  | sortOrder | integer (int32) | **Yes** | Display order |

  #### examinations[] — `CreateTemplateExaminationItem`
  | Field | Type | Required | Description |
  |-------|------|----------|-------------|
  | examinationId | string (uuid) | No | Link to examinations catalog |
  | customDescription | string | No | Custom examination note |
  | sortOrder | integer (int32) | **Yes** | Display order |

  #### advices[] — `CreateTemplateAdviceItem`
  | Field | Type | Required | Description |
  |-------|------|----------|-------------|
  | adviceId | string (uuid) | No | Link to advice catalog |
  | customDescriptionEn | string | No | Custom English description |
  | customDescriptionBn | string | No | Custom Bengali description |
  | sortOrder | integer (int32) | **Yes** | Display order |

  #### drugs[] — `CreateTemplateDrugItem`
  | Field | Type | Required | Description |
  |-------|------|----------|-------------|
  | drugId | string (uuid) | No | Link to drug catalog |
  | customDrugName | string | No | Custom drug name |
  | customForm | string | No | Custom formulation |
  | customStrength | string | No | Custom strength |
  | customGenericName | string | No | Custom generic name |
  | dosageInstructionsBn | string | No | Bengali dosage |
  | dosageInstructionsEn | string | No | English dosage |
  | sortOrder | integer (int32) | **Yes** | Display order |

  #### tests[] — `CreateTemplateTestItem`
  | Field | Type | Required | Description |
  |-------|------|----------|-------------|
  | reportId | string (uuid) | No | Link to medical tests catalog |
  | customName | string | No | Custom test name |
  | customAbbreviation | string | No | Custom abbreviation |
  | sortOrder | integer (int32) | **Yes** | Display order |

  ### Response — 201 Created
  Returns `TemplateDetailDto`.
