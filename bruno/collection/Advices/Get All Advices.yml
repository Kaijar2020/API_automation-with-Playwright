info:
  name: Get All Advices
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/prescription/Advices?page=1&pageSize=20"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: page
      value: "1"
      type: query
    - name: pageSize
      value: "20"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  ## Get All Advices

  Returns a paginated list of all advice entries.

  ### Query Parameters
  | Parameter | Type | Required | Default | Description |
  |-----------|------|----------|---------|-------------|
  | page | integer (int32) | No | 1 | Page number |
  | pageSize | integer (int32) | No | 20 | Items per page |

  ### Response — 200 OK
  Returns `AdviceDtoPagedResult`:
  ```json
  {
    "items": [
      {
        "id": "uuid",
        "name": "string",
        "descriptionEn": "string",
        "descriptionBn": "string",
        "isActive": true
      }
    ],
    "totalCount": 100,
    "pageNumber": 1,
    "pageSize": 20
  }
  ```
