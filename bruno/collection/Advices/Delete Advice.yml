info:
  name: Delete Advice
  type: http
  seq: 7

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/prescription/Advices/{{adviceId}}"
  headers:
    - name: Authorization
      value: Bearer {{authToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  ## Delete Advice

  ### Path Parameters
  | Parameter | Type | Required | Description |
  |-----------|------|----------|-------------|
  | id | string (uuid) | **Yes** | Unique identifier of the advice |

  ### Response — 204 No Content
  Successfully deleted.

  ### Response — 404 Not Found
  Returns `ProblemDetails`.
