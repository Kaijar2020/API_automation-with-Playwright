info:
  name: Create Advice
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/v1/prescription/Advices"
  headers:
    - name: Authorization
      value: Bearer {{authToken}}
      description: JWT Bearer token
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Drink plenty of water",
        "descriptionEn": "Drink at least 8 glasses of water per day",
        "descriptionBn": "প্রতিদিন অন্তত ৮ গ্লাস পানি পান করুন"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  ## Create Advice

  Creates a new advice entry.

  ### Request Body — `CreateAdviceRequest`
  | Field | Type | Required | Description |
  |-------|------|----------|-------------|
  | name | string | No | Short name/title of the advice |
  | descriptionEn | string | No | Full description in English |
  | descriptionBn | string | No | Full description in Bengali |

  ### Response — 201 Created
  Returns `AdviceDto`:
  ```json
  {
    "id": "uuid",
    "name": "string",
    "descriptionEn": "string",
    "descriptionBn": "string",
    "isActive": true
  }
  ```

  ### Response — 400 Bad Request
  Returns `ProblemDetails` with validation errors.
