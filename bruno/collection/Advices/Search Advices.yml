info:
  name: Search Advices
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/v1/prescription/Advices/search?searchTerm=avoid&page=1&pageSize=10"
  headers:
    - name: Authorization
      value: Bearer {{authToken}}
    - name: Accept
      value: application/json
  params:
    - name: searchTerm
      value: avoid
      type: query
      description: Text to search within advice names/descriptions (string)
    - name: page
      value: "1"
      type: query
      description: "Page number (int32, default: 1)"
    - name: pageSize
      value: "10"
      type: query
      description: "Items per page (int32, default: 10)"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  ## Search Advices

  Search advice entries by a keyword.

  ### Query Parameters
  | Parameter | Type | Required | Default | Description |
  |-----------|------|----------|---------|-------------|
  | searchTerm | string | No | — | Keyword to search |
  | page | integer (int32) | No | 1 | Page number |
  | pageSize | integer (int32) | No | 10 | Items per page |

  ### Response — 200 OK
  Returns `AdviceDtoPagedResult`.
