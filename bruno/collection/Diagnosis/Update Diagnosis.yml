info:
  name: Update Diagnosis
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/prescription/Diagnosis/{{diagnosisId}}"
  headers:
    - name: Authorization
      value: Bearer {{authToken}}
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "autoCompleteText": "Type 2 Diabetes Mellitus (Updated)",
        "autoCompleteTextBn": "টাইপ ২ ডায়াবেটিস (আপডেট)"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ## Update Diagnosis

  ### Path Parameters
  | Parameter | Type | Required | Description |
  |-----------|------|----------|-------------|
  | id | string (uuid) | **Yes** | Unique identifier of the diagnosis |

  ### Request Body — `UpdateDiagnosisRequest`
  | Field | Type | Required | Description |
  |-------|------|----------|-------------|
  | autoCompleteText | string | No | Updated English text |
  | autoCompleteTextBn | string | No | Updated Bengali text |

  ### Response — 200 OK / 404 Not Found
