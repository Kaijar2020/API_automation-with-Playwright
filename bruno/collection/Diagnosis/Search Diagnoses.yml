info:
  name: Search Diagnoses
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/prescription/Diagnosis/search?searchTerm=diabetes&page=1&pageSize=10"
  headers:
    - name: Authorization
      value: Bearer {{authToken}}
    - name: Accept
      value: application/json
  params:
    - name: searchTerm
      value: diabetes
      type: query
      description: Keyword to search (string)
    - name: page
      value: "1"
      type: query
      description: "Page number (int32, default: 1)"
    - name: pageSize
      value: "10"
      type: query
      description: "Items per page (int32, default: 10)"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ## Search Diagnoses

  Search diagnosis entries by keyword for auto-complete.

  ### Response — 200 OK
  Returns `DiagnosisSearchDtoPagedResult`.
