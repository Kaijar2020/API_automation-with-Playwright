info:
  name: Get All Diagnoses
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/prescription/Diagnosis?page=1&pageSize=10"
  headers:
    - name: Authorization
      value: Bearer {{authToken}}
    - name: Accept
      value: application/json
  params:
    - name: page
      value: "1"
      type: query
      description: "Page number (int32, default: 1)"
    - name: pageSize
      value: "10"
      type: query
      description: "Items per page (int32, default: 20)"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  ## Get All Diagnoses

  Returns a paginated list of all diagnosis entries.

  ### Response — 200 OK
  Returns `DiagnosisSearchDtoPagedResult`:
  ```json
  {
    "items": [
      {
        "id": "uuid",
        "autoCompleteText": "Type 2 Diabetes Mellitus",
        "autoCompleteTextBn": "টাইপ ২ ডায়াবেটিস"
      }
    ],
    "totalCount": 500,
    "pageNumber": 1,
    "pageSize": 20
  }
  ```
