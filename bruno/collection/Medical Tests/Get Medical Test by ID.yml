info:
  name: Get Medical Test by ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/prescription/MedicalTests/{{medicalTestId}}"
  headers:
    - name: Authorization
      value: Bearer {{authToken}}
    - name: Accept
      value: application/json
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ## Get Medical Test by ID

  ### Path Parameters
  | Parameter | Type | Required | Description |
  |-----------|------|----------|-------------|
  | id | string (uuid) | **Yes** | Medical test unique identifier |

  ### Response — 200 OK
  Returns `MedicalTestDto`:
  ```json
  {
    "id": "uuid",
    "fullName": "Complete Blood Count",
    "abbreviation": "CBC",
    "defaultValue": "string",
    "isActive": true
  }
  ```

  ### Response — 404 Not Found
