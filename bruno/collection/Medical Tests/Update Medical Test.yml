info:
  name: Update Medical Test
  type: http
  seq: 5

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/prescription/MedicalTests/{{medicalTestId}}"
  headers:
    - name: Authorization
      value: Bearer {{authToken}}
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "abbreviation": "HbA1c",
        "fullName": "Glycated Hemoglobin (Updated)",
        "defaultValue": "--",
        "normalRange": "< 5.7%",
        "cost": 900.00
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ## Update Medical Test

  ### Path Parameters
  | Parameter | Type | Required | Description |
  |-----------|------|----------|-------------|
  | id | string (uuid) | **Yes** | Medical test unique identifier |

  ### Request Body — `UpdateMedicalTestRequest`
  Same fields as Create.

  ### Response — 200 OK / 404 Not Found
