info:
  name: Search Medical Tests
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/prescription/MedicalTests/search?searchTerm=CBC&page=1&pageSize=10"
  headers:
    - name: Authorization
      value: Bearer {{authToken}}
    - name: Accept
      value: application/json
  params:
    - name: searchTerm
      value: CBC
      type: query
      description: Test name or abbreviation to search (string)
    - name: page
      value: "1"
      type: query
      description: "Page number (int32, default: 1)"
    - name: pageSize
      value: "10"
      type: query
      description: "Items per page (int32, default: 10)"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ## Search Medical Tests

  ### Response — 200 OK
  Returns `MedicalTestSearchDtoPagedResult`:
  ```json
  {
    "items": [
      {
        "id": "uuid",
        "abbreviation": "CBC",
        "fullName": "Complete Blood Count",
        "defaultValue": "string",
        "normalRange": "4.5–11.0 × 10⁹/L",
        "cost": 350.00
      }
    ],
    "totalCount": 50,
    "pageNumber": 1,
    "pageSize": 10
  }
  ```
